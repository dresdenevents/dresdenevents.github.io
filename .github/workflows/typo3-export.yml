name: TYPO3 → Static Export

on:
  push:
    branches: [main]
    paths:
      - "typo3-source/**"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      db:
        image: mariadb:11
        env:
          MYSQL_DATABASE: typo3
          MYSQL_USER: typo3
          MYSQL_PASSWORD: typo3
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, mbstring, intl, gd, zip, xml, curl

      - name: Install Composer dependencies
        working-directory: typo3-source
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Write TYPO3 settings.php
        working-directory: typo3-source
        run: |
          mkdir -p config/system
          cat > config/system/settings.php << 'PHP'
          <?php
          return [
              'DB' => [
                  'Connections' => [
                      'Default' => [
                          'charset'  => 'utf8mb4',
                          'dbname'   => 'typo3',
                          'driver'   => 'mysqli',
                          'host'     => '127.0.0.1',
                          'password' => 'typo3',
                          'port'     => 3306,
                          'user'     => 'typo3',
                          'tableoptions' => [
                              'charset' => 'utf8mb4',
                              'collate' => 'utf8mb4_unicode_ci',
                          ],
                      ],
                  ],
              ],
              'SYS' => [
                  'encryptionKey' => '${{ secrets.TYPO3_ENCRYPTION_KEY }}',
                  'trustedHostsPattern' => '.*',
                  'devIPmask' => '*',
                  'displayErrors' => 0,
              ],
              'GFX' => [
                  'processor_enabled' => false,
              ],
          ];
          PHP

      - name: Set up TYPO3
        working-directory: typo3-source
        run: |
          php vendor/bin/typo3 setup \
            --no-interaction \
            --server-type=apache \
            --driver=mysqli \
            --host=127.0.0.1 \
            --port=3306 \
            --dbname=typo3 \
            --username=typo3 \
            --password=typo3 \
            --admin-username=admin \
            --admin-user-password="${{ secrets.TYPO3_ADMIN_PASSWORD }}" \
            --admin-email=odenwald91@gmail.com \
            --project-name="Dresden Events Demo" \
            --create-site="http://localhost:8080" \
            --force 2>&1 || true

      - name: Import content DB dump (optional)
        working-directory: typo3-source
        run: |
          if [ -f scripts/content.sql.gz ]; then
            echo "Importing content dump..."
            gunzip -c scripts/content.sql.gz | mysql -h 127.0.0.1 -u typo3 -ptypo3 typo3
          fi

      - name: Start PHP built-in server
        working-directory: typo3-source
        run: |
          php -S 0.0.0.0:8080 -t public/ &
          sleep 3
          curl -sf http://localhost:8080/ > /dev/null && echo "Server ready"

      - name: Crawl static site
        run: |
          mkdir -p _crawl
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --no-verbose \
            --directory-prefix=_crawl \
            --reject="*.php" \
            --exclude-directories="/typo3,/typo3temp" \
            http://localhost:8080/ 2>&1 || true
          echo "Crawled files:"
          find _crawl -name "*.html" | head -20

      - name: Copy to typo3-demo/
        run: |
          CRAWLED="_crawl/localhost+8080"
          if [ ! -d "$CRAWLED" ]; then
            echo "ERROR: No crawled output at $CRAWLED"; exit 1
          fi
          rm -rf typo3-demo
          mkdir -p typo3-demo
          cp -r "$CRAWLED/." typo3-demo/

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add typo3-demo
          git diff --cached --quiet && echo "No changes to deploy." && exit 0
          git commit -m "chore: TYPO3 static export $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
