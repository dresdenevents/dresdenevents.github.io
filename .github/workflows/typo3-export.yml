name: TYPO3 → Static Export

on:
  push:
    branches: [main]
    paths:
      - "typo3-source/**"
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    services:
      db:
        image: mariadb:11
        env:
          MYSQL_DATABASE: typo3
          MYSQL_USER: typo3
          MYSQL_PASSWORD: typo3
          MYSQL_ROOT_PASSWORD: root
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli, mbstring, intl, gd, zip, xml, curl

      - name: Wait for MariaDB and seed homepage
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -u typo3 -ptypo3 typo3 -e "SELECT 1" 2>/dev/null && echo "DB ready" && break
            echo "Waiting for DB... ($i)"; sleep 2
          done
          mysql -h 127.0.0.1 -u typo3 -ptypo3 typo3 -e "
            INSERT IGNORE INTO pages (uid, pid, title, slug, doktype, is_siteroot, hidden, deleted, sorting, tstamp, crdate)
            VALUES (1, 0, 'Dresden Events Demo', '/', 1, 1, 0, 0, 128, UNIX_TIMESTAMP(), UNIX_TIMESTAMP());
          " 2>/dev/null || true

      - name: Install Composer dependencies
        working-directory: typo3-source
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up TYPO3
        working-directory: typo3-source
        run: |
          php -d display_errors=1 vendor/bin/typo3 setup \
            --no-interaction \
            --server-type=apache \
            --driver=mysqli \
            --host=127.0.0.1 \
            --port=3306 \
            --dbname=typo3 \
            --username=typo3 \
            --password=typo3 \
            --admin-username=admin \
            --admin-user-password="${{ secrets.TYPO3_ADMIN_PASSWORD }}" \
            --admin-email=odenwald91@gmail.com \
            --project-name="Dresden Events Demo" \
            --create-site="http://localhost:8080" \
            --force > /tmp/typo3setup.log 2>&1 || true
          cat /tmp/typo3setup.log

      - name: Write final settings.php
        working-directory: typo3-source
        env:
          TYPO3_ENCRYPTION_KEY: ${{ secrets.TYPO3_ENCRYPTION_KEY }}
        run: |
          cat > config/system/settings.php << PHP
          <?php
          return [
              'BE' => ['passwordHashing' => ['className' => 'TYPO3\\\\CMS\\\\Core\\\\Crypto\\\\PasswordHashing\\\\Argon2iPasswordHash', 'options' => []]],
              'DB' => ['Connections' => ['Default' => [
                  'charset' => 'utf8mb4',
                  'dbname'  => 'typo3',
                  'driver'  => 'mysqli',
                  'host'    => '127.0.0.1',
                  'password'=> 'typo3',
                  'port'    => 3306,
                  'user'    => 'typo3',
                  'tableoptions' => ['charset' => 'utf8mb4', 'collate' => 'utf8mb4_unicode_ci'],
              ]]],
              'GFX' => ['processor_enabled' => false],
              'SYS' => [
                  'encryptionKey'     => '${TYPO3_ENCRYPTION_KEY}',
                  'trustedHostsPattern' => '.*',
                  'devIPmask'         => '*',
                  'displayErrors'     => 1,
                  'sitename'          => 'Dresden Events Demo',
              ],
          ];
          PHP

      - name: Fix site base URL for CI
        working-directory: typo3-source
        run: |
          sed -i "s|base:.*dresdenevents-typo3.ddev.site.*|base: 'http://localhost:8080'|" config/sites/main/config.yaml
          cat config/sites/main/config.yaml

      - name: Import content DB dump (optional)
        working-directory: typo3-source
        run: |
          if [ -f scripts/content.sql.gz ]; then
            echo "Importing content dump..."
            gunzip -c scripts/content.sql.gz | mysql -h 127.0.0.1 -u typo3 -ptypo3 typo3
          fi

      - name: Prepare TYPO3 runtime directories
        working-directory: typo3-source
        run: |
          mkdir -p var/cache var/labels var/lock var/log var/session
          mkdir -p public/typo3temp/assets
          chmod -R 777 var/ public/typo3temp/

      - name: Start PHP built-in server
        working-directory: typo3-source
        run: |
          cat > public/router.php << 'PHP'
          <?php
          $path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
          $file = __DIR__ . $path;
          if ($path !== '/' && is_file($file)) { return false; }
          require __DIR__ . '/index.php';
          PHP
          php -d display_errors=1 -d error_reporting=E_ALL -S 0.0.0.0:8080 -t public/ public/router.php &
          sleep 3
          HTTP=$(curl -s http://localhost:8080/ -o /tmp/typo3_response.html -w "%{http_code}")
          echo "HTTP $HTTP"
          if [ "$HTTP" != "200" ]; then
            echo "--- Response body ---"
            cat /tmp/typo3_response.html | head -50
          fi

      - name: Crawl static site
        run: |
          mkdir -p _crawl
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --page-requisites \
            --no-parent \
            --no-verbose \
            --directory-prefix=_crawl \
            --reject="*.php" \
            --exclude-directories="/typo3,/typo3temp" \
            http://localhost:8080/ 2>&1 || true
          echo "Crawled files:"
          find _crawl -name "*.html" | head -20

      - name: Copy to typo3-demo/
        run: |
          CRAWLED="_crawl/localhost+8080"
          if [ ! -d "$CRAWLED" ]; then
            echo "ERROR: No crawled output at $CRAWLED"; exit 1
          fi
          rm -rf typo3-demo
          mkdir -p typo3-demo
          cp -r "$CRAWLED/." typo3-demo/

      - name: Commit and push
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add typo3-demo
          git diff --cached --quiet && echo "No changes to deploy." && exit 0
          git commit -m "chore: TYPO3 static export $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
